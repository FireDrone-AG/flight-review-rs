name: FireDrone image

# Builds deploy/firedrone/Dockerfile (server with S3 + web app) and pushes it to
# ghcr.io/firedrone-ag/flight-review. Release with a tag like firedrone-v0.1.0
# (image tag 0.1.0). The upstream release.yml reacts to v* tags only, so the
# two never run for the same tag.

on:
  push:
    tags:
      - "firedrone-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/firedrone-ag/flight-review

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=firedrone-v(.*),group=1
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/firedrone/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optional repository variable (Settings > Secrets and variables >
          # Actions > Variables). A public, URL-restricted Mapbox token.
          build-args: |
            PUBLIC_MAPBOX_TOKEN=${{ vars.PUBLIC_MAPBOX_TOKEN }}
          cache-from: type=gha,scope=firedrone-image
          cache-to: type=gha,mode=max,scope=firedrone-image

      - name: Smoke test
        run: |
          docker run -d --name fr -p 8080:8080 ${{ env.IMAGE }}:sha-${GITHUB_SHA::7}
          for i in $(seq 20); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -qi '<html'
          curl -fsS http://localhost:8080/browse | grep -qi '<html'
          docker rm -f fr
